<meta name="color-scheme" content="light dark"><title>接种簿 | 儿童疫苗记录</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6b58'/%3E%3Ctext x='16' y='22' font-size='17' text-anchor='middle' fill='%23f4f7f4' font-family='sans-serif'%3E%E7%B0%BF%3C/text%3E%3C/svg%3E">
<style>
/* Design read: 家庭健康记录工具（非营销页），面向中国家长；信任优先、平静、温和、移动优先。
   Dials: DESIGN_VARIANCE 4 / MOTION_INTENSITY 3 / VISUAL_DENSITY 5（trust-first 档）。
   不使用设计系统包（需离线单文件），原生 CSS + 系统中文字体。
   形状规则：面板 16px，控件/标签 10px，主按钮 10px。单一强调色：松绿 --accent。
   状态色（逾期/临近）仅表达语义状态。 */
:root{
 --bg:#eef1ee;--surface:#f8faf8;--raised:#ffffff0d;--line:#d8dfda;--text:#1d2621;--muted:#56645c;--faint:#7a877f;
 --accent:#2f6b58;--accent-ink:#f4f7f4;--accent-soft:#e1ece6;
 --late:#a63d32;--late-soft:#f6e4e1;--soon:#8a5a12;--soon-soft:#f5ecd9;--ok:#2f6b58;--ok-soft:#e1ece6;--idle:#56645c;--idle-soft:#e7ebe8;
 --shadow:0 1px 2px #2f4a3d14,0 8px 24px -12px #2f4a3d29;
 --r-hero:20px;--r-panel:14px;--r-ctl:10px;
 --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
 --bg:#121614;--surface:#1a201d;--line:#2b3430;--text:#e6ebe8;--muted:#a3b0a9;--faint:#83918a;
 --accent:#7fbfa6;--accent-ink:#0f1b16;--accent-soft:#1f2f28;
 --late:#f0a196;--late-soft:#3a2220;--soon:#e2bd78;--soon-soft:#33291a;--ok:#7fbfa6;--ok-soft:#1f2f28;--idle:#a3b0a9;--idle-soft:#242b28;
 --shadow:0 1px 2px #0006,0 8px 24px -12px #0009}}
*{box-sizing:border-box}[hidden]{display:none!important}html{scroll-behavior:smooth}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font:15px/1.6 var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}.muted{color:var(--muted)}.faint{color:var(--faint);font-size:13px}
button,select,input{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--surface);cursor:pointer;white-space:nowrap;
 transition:transform .2s cubic-bezier(.16,1,.3,1),background-color .2s,border-color .2s}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}.btn:active{transform:translateY(1px) scale(.98)}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}.btn.p:hover{filter:brightness(1.06)}
.btn.link{border-color:transparent;background:none;color:var(--accent);padding:0 8px;min-height:36px}
.btn.danger{color:var(--late)}.btn.sm{min-height:34px;padding:0 12px;font-size:14px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;height:60px;padding:0 20px;display:flex;align-items:center;gap:14px}
.brand{font-weight:700;font-size:18px;letter-spacing:.02em;color:var(--accent)}.brand small{font-weight:400;color:var(--muted);font-size:13px;margin-left:8px;letter-spacing:0}
.picker{margin-left:auto;display:flex;align-items:center;gap:6px}
.picker select{min-height:40px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--surface);padding:0 10px;max-width:46vw}
.wrap{max-width:1180px;margin:0 auto;padding:20px 20px 56px}
.notice{border-left:3px solid var(--soon);background:var(--soon-soft);padding:10px 14px;border-radius:0 var(--r-ctl) var(--r-ctl) 0;font-size:13.5px;color:var(--text);margin-bottom:12px;max-width:80ch}
.notice.info{border-color:var(--accent);background:var(--accent-soft)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:8px 0 22px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 14px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-size:15px}
.tabs button.on{color:var(--text);border-color:var(--accent);font-weight:600}
.panel{background:var(--surface);border-radius:var(--r-panel);border:1px solid var(--line);padding:20px}
.aside.panel{background:transparent;border-style:dashed}
.grid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(280px,1fr);gap:24px;align-items:start}
.stack>*+*{margin-top:24px}
/* 下一针 */
.next{display:grid;grid-template-columns:auto 1fr;gap:4px 28px;align-items:center;padding:28px 28px 24px;border-radius:var(--r-hero);
 background:var(--accent);color:var(--accent-ink);box-shadow:none;position:relative;overflow:hidden}
.next:after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;border:28px solid color-mix(in srgb,var(--accent-ink) 9%,transparent);pointer-events:none}
.next .when{font-size:56px;line-height:1;font-weight:800;letter-spacing:-.03em;padding-right:28px;border-right:1px solid color-mix(in srgb,var(--accent-ink) 30%,transparent)}
.next .when small{display:block;font-size:14px;font-weight:500;letter-spacing:0;margin-top:8px;opacity:.85}
.next.late{background:var(--late)}
.next .what h2{font-size:22px;line-height:1.3}.next .what p{margin-top:4px;opacity:.88}
.next .acts{grid-column:1/-1;margin-top:20px;display:flex;gap:8px;flex-wrap:wrap}
.next .btn{background:var(--accent-ink);color:var(--accent);border-color:transparent}.next.late .btn{color:var(--late)}
.next .btn.ghost{background:transparent;color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent-ink) 45%,transparent)}
@media (prefers-reduced-motion:no-preference){.next{animation:rise .5s cubic-bezier(.16,1,.3,1) both}@keyframes rise{from{opacity:0;transform:translateY(8px)}}}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}.sec-h h3{font-size:18px}
/* 疫苗行 */
.v{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 0}
.v+.v{border-top:1px solid var(--line)}
.v .n{font-weight:600}.v .meta{grid-column:1;color:var(--muted);font-size:13.5px}
.v .act{grid-row:1/3;grid-column:2;align-self:center}
.v .tip{grid-column:1/-1;font-size:13px;color:var(--late);background:var(--late-soft);border-radius:var(--r-ctl);padding:8px 10px;margin-top:6px;max-width:72ch}
.chip{display:inline-block;font-size:12px;line-height:20px;padding:0 8px;border-radius:6px;margin-left:6px;vertical-align:1px;font-weight:500}
.s-overdue{color:var(--late);background:var(--late-soft)}.s-soon{color:var(--soon);background:var(--soon-soft)}.s-done{color:var(--ok);background:var(--ok-soft)}
.s-covered{color:var(--accent);background:var(--accent-soft)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.opt{display:flex;align-items:center;gap:8px;min-height:40px;padding:6px 12px;border:1px solid var(--line);border-radius:var(--r-ctl);cursor:pointer;font-size:14px;background:var(--bg)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}.opt input{accent-color:var(--accent);width:16px;height:16px;margin:0}.opt small{display:block;font-size:12px;color:var(--muted)}
.covered-note{margin-top:10px;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}.covered-note b{font-weight:500;margin-right:4px}.covered-note .chip{margin-left:0}
.avail{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.avail summary{cursor:pointer;color:var(--muted);font-size:14px}
.s-future,.s-expired,.s-alt,.s-unselected{color:var(--idle);background:var(--idle-soft)}
.k-self{color:var(--muted);border:1px solid var(--line);background:none}
/* 侧栏 */
.who h2{font-size:22px}.who p{margin-top:2px}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:18px 12px;margin:18px 0 6px}
.nums b{display:block;font-size:28px;line-height:1.1;font-weight:700}.nums span{font-size:13px;color:var(--muted)}
.nums .late b{color:var(--late)}.nums .soon b{color:var(--soon)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
/* 时间轴 */
.tl{position:relative;padding-left:22px}.tl:before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .age{position:relative;margin:22px 0 6px;font-weight:600}.tl .age:first-child{margin-top:0}
.tl .age:before{content:"";position:absolute;left:-21px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl .age .faint{font-weight:400;margin-left:8px}
.tl .row{display:flex;gap:8px;align-items:baseline;padding:3px 0;font-size:14.5px}.tl .row .mk{width:16px;flex:none;color:var(--faint)}.tl .row.ok .mk{color:var(--ok)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
/* 空状态 */
.hello{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:32px;align-items:center;padding:36px}
.hello h1{font-size:32px;line-height:1.2}.hello p{margin-top:12px;max-width:34ch;color:var(--muted)}
.hello .acts{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.hello ol{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:14px}
.hello li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;font-size:14px;color:var(--muted)}
.hello li:before{content:counter(s);width:26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:13px}
.hello li b{display:block;color:var(--text);font-weight:600}
.src{margin-top:32px;font-size:12.5px;color:var(--faint);max-width:90ch;line-height:1.7}
/* 弹层：移动端底部抽屉 */
dialog{border:0;border-radius:var(--r-panel);padding:0;width:min(440px,92vw);background:var(--surface);color:var(--text);box-shadow:0 24px 60px -20px #0b1a1366}
dialog::backdrop{background:#0e1a1459}
#dform{padding:22px}#dform h3{font-size:18px;margin-bottom:6px}
.f{display:grid;gap:6px;margin-top:14px}.f span{font-size:13.5px;font-weight:500;color:var(--muted)}
.f input,.f select{min-height:44px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--bg);padding:0 12px;width:100%}
.f input:focus,.f select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.d-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:3;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:var(--r-ctl);font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
.err{color:var(--late)}
@media (max-width:860px){.grid,.cols,.hello{grid-template-columns:1fr}.hello{padding:24px}.aside{order:-1}}
@media (max-width:767px){
 .top-in{padding:0 14px;gap:8px}.brand small{display:none}.wrap{padding:14px 14px 48px}
 .panel{padding:16px}.next{padding:20px;grid-template-columns:1fr}.next .when{font-size:44px;border-right:0;padding:0 0 12px;border-bottom:1px solid color-mix(in srgb,var(--accent-ink) 30%,transparent);margin-bottom:8px}
 .hello h1{font-size:26px}.v{grid-template-columns:1fr}.v .act{grid-row:auto;grid-column:1;justify-self:start;margin-top:6px}
 dialog{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:var(--r-panel) var(--r-panel) 0 0}
 #dform{padding:20px 18px calc(20px + env(safe-area-inset-bottom))}.d-acts .btn{flex:1;justify-content:center}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style></head><body>

 {id:'rv5',name:'5价轮状病毒疫苗(口服)',group:'轮状',excl:'rota',nip:false,doses:[{age:{w:6},label:'第1剂(6-12周龄)'},{age:{w:10},minInt:28,label:'第2剂'},{age:{w:14},minInt:28,label:'第3剂(32周龄前完成)'}],maxAge:{w:32},perProduct:true},
 {id:'rv3',name:'三价轮状病毒疫苗(口服，兰州所)',group:'轮状',excl:'rota',nip:false,doses:[{age:{w:6},label:'第1剂(6-13周龄开始)'},{age:{w:10},minInt:30,label:'第2剂(间隔1个月)'},{age:{w:14},minInt:30,label:'第3剂(不晚于32周龄)'}],maxAge:{w:32},perProduct:true,catchup:'首剂6-13周龄，间隔1个月，第3剂不晚于32周龄；与5价轮状二选一。'},
 {id:'var',name:'水痘疫苗',group:'水痘',nip:false,doses:[{age:{m:12},label:'第1剂'},{age:{y:4},minInt:90,label:'第2剂'}],perProduct:true},
 {id:'flu',name:'流感疫苗(每年)',group:'流感',nip:false,yearly:true,doses:[{age:{m:6},label:'每年流行季前(首次接种8岁以下需2剂间隔≥4周)'}],perProduct:true},

const DAY=864e5;
function parse(s){const [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d));}
function fmt(d){return d.toISOString().slice(0,10);}
function addAge(b,a){const d=new Date(b);d.setUTCFullYear(d.getUTCFullYear()+(a.y||0));d.setUTCMonth(d.getUTCMonth()+(a.m||0));d.setUTCDate(d.getUTCDate()+(a.d||0)+(a.w||0)*7);return d;}
function addDays(d,n){return new Date(d.getTime()+n*DAY);}
// records: [{vid,dose(0-based),date,batch,note}]
// 自费疫苗是否纳入计划：selfPaid[id]===false 明确取消时不再提醒（已有记录仍计数）；selfPaid[id]===true 或已有接种记录（且未明确取消）视为已选。旧备份无 selfPaid 字段时同样适用。
function isSelected(child,v){if(v.nip)return true;const sp=child.selfPaid||{};if(sp[v.id]===false)return false;return sp[v.id]===true||(child.records||[]).some(r=>r.vid===v.id);}
// covers 通用机制：coverer.covers = {目标疫苗id: [目标剂次下标...]}，coverer 第 i 剂覆盖目标第 covers[t][i] 剂。
function seriesPlan(child,today){
 today=today?parse(today):parse(new Date().toISOString().slice(0,10));
 const birth=parse(child.birth),recs=child.records||[],out=[];
 const done=id=>recs.filter(r=>r.vid===id).sort((a,b)=>a.date<b.date?-1:1);
 const byId=Object.fromEntries(V.map(v=>[v.id,v]));
 const coverDates={},planned={},coverInfo={};
 // 1) 已接种的 coverer 剂次计入目标疫苗（无论现在是否仍选择该 coverer）
 V.forEach(v=>{if(!v.covers)return;done(v.id).forEach((r,i)=>{for(const t in v.covers)if(i<v.covers[t].length)(coverDates[t]=coverDates[t]||[]).push(r.date);});});
 const combined=id=>done(id).map(r=>r.date).concat(coverDates[id]||[]).sort();
 // 2) coverer 进度 = 各目标已完成剂次（含单苗+联合苗）在覆盖范围内的最小值；计划覆盖其余剂次
 V.forEach(v=>{if(!v.covers||!isSelected(child,v))return;
  const prog=Math.min(v.doses.length,...Object.keys(v.covers).filter(t=>byId[t].nip||isSelected(child,byId[t])).map(t=>Math.min(combined(t).length,v.covers[t].length)));
  coverInfo[v.id]={prog};
  if(prog<v.doses.length)for(const t of Object.keys(v.covers)){const n=combined(t).length;const slots=v.covers[t].filter(k=>k>=n);if(slots.length)planned[t]={by:v.id,byName:v.name,max:Math.max(...v.covers[t])};}
 });
 for(const v of V){
  if(v.sexOnly&&child.sex&&child.sex!==v.sexOnly&&v.nip)continue;
  if(v.id==='hpv2'&&child.birth<'2011-11-10')continue;
  const sel=isSelected(child,v);
  let allDates=combined(v.id);
  // coverer 自身：进度按覆盖目标计算（支持中途切换）
  if(v.covers&&coverInfo[v.id]){const ds=Object.keys(v.covers).flatMap(t=>combined(t)).sort();const p=coverInfo[v.id].prog;allDates=ds.length?Array(p).fill(null).map((_,i)=>ds[ds.length-1]):[];if(p)allDates[p-1]=ds[ds.length-1];}
  let n=allDates.length;
  const rs=done(v.id);
  const altDone=v.alt&&done(v.alt).length>0&&rs.length===0;
  let status,due=null,nextLabel='',catchup=false,coveredBy=null,laterDue=null,laterLabel='';
  if(!sel)status='unselected';
  else if(altDone)status='alt';
  else if(n>=v.doses.length&&!v.yearly)status='done';
  else if(planned[v.id]&&n<=planned[v.id].max){status='covered';coveredBy=planned[v.id].byName;
   const k=planned[v.id].max+1;if(k<v.doses.length){laterDue=fmt(addAge(birth,v.doses[k].age));laterLabel=v.doses[k].label;}}
  else{
   const idx=v.yearly?0:n,d=v.doses[idx];
   due=addAge(birth,d.age);
   if(v.yearly&&n){const last=parse(allDates[n-1]);const nx=addDays(last,365);if(nx>due)due=nx;}
   if(!v.yearly&&n&&d.minInt){const t=addDays(parse(allDates[n-1]),d.minInt);if(t>due)due=t;}
   if(d.minFrom&&allDates[d.minFrom.dose]){const t=addDays(parse(allDates[d.minFrom.dose]),d.minFrom.days);if(t>due)due=t;}
   if(v.id==='mpsvac'&&idx===0){const a=done('mpsva').length,ge24=today>=addAge(birth,{m:24});if(ge24&&a<2){const t=addAge(birth,{m:24});due=a===1?new Date(Math.max(t,addDays(parse(done('mpsva')[0].date),90))):t;}else if(a>=2){const t=addDays(parse(done('mpsva')[a-1].date),365);if(t>due)due=t;}}
   else if(d.minPrevSeries){const p=combined(d.minPrevSeries.id);if(p.length){const t=addDays(parse(p[p.length-1]),d.minPrevSeries.days);if(t>due)due=t;}}
   nextLabel=d.label;
   if(v.maxAge&&today>=addAge(birth,v.maxAge)){status='expired';}
   else{
    const diff=(due-today)/DAY;
    if(diff<0){status='overdue';catchup=true;due=today>due?today:due;}
    else if(diff<=30)status='soon';else status='future';
    if(catchup&&n&&d.minInt){const t=addDays(parse(allDates[n-1]),d.minInt);if(t>due)due=t;}
   }
  }
  if(v.catchupOnly){const dn=combined('dtap').length;const age7=today>=addAge(birth,{y:7});
   if(status!=='done'&&(!age7||dn>=5)){status='alt';due=null;}}
  out.push({id:v.id,name:v.name,group:v.group,nip:v.nip,excl:v.excl||null,selected:sel,given:Math.min(n,v.doses.length),total:v.doses.length,status,due:due?fmt(due):null,nextLabel,coveredBy,laterDue,laterLabel,catchupNote:v.catchup||'',perProduct:!!v.perProduct,optional:!v.nip});
 }
 return out;
}
function statusOf(d,today){const diff=(parse(d)-today)/DAY;return diff<0?'overdue':diff<=30?'soon':'future';}
function upcoming(child,today){const T=today?parse(today):parse(new Date().toISOString().slice(0,10));const L=[];
 seriesPlan(child,today).forEach(s=>{if(s.due&&['overdue','soon','future'].includes(s.status))L.push(s);
  else if(s.status==='covered'&&s.laterDue)L.push({...s,status:statusOf(s.laterDue,T),due:s.laterDue<fmt(T)?fmt(T):s.laterDue,nextLabel:s.laterLabel,later:true});});
 return L.sort((a,b)=>a.due<b.due?-1:1);}
function timeline(child){const b=parse(child.birth),items=[];for(const v of V){if(v.catchupOnly||(v.sexOnly&&child.sex&&child.sex!==v.sexOnly&&v.nip))continue;v.doses.forEach((d,i)=>items.push({vid:v.id,dose:i,name:v.name,label:d.label,nip:v.nip,date:fmt(addAge(b,d.age)),age:d.age}));}return items.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(b.nip-a.nip));}
function ics(child,today){const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//vaccine-tracker//CN','CALSCALE:GREGORIAN'];upcoming(child,today).forEach((s,i)=>{const d=s.due.replace(/-/g,'');L.push('BEGIN:VEVENT','UID:'+child.id+'-'+s.id+'-'+d+'@vt','DTSTAMP:'+d+'T000000Z','DTSTART;VALUE=DATE:'+d,'SUMMARY:'+child.name+' 接种 '+s.name+' '+s.nextLabel,'DESCRIPTION:仅供参考，请以接种门诊安排为准','BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:疫苗接种提醒','END:VALARM','END:VEVENT');});L.push('END:VCALENDAR');return L.join('\r\n');}
function ageText(birth,today){const b=parse(birth),t=today?parse(today):new Date();let m=(t.getUTCFullYear()-b.getUTCFullYear())*12+t.getUTCMonth()-b.getUTCMonth();if(t.getUTCDate()<b.getUTCDate())m--;if(m<1)return Math.floor((t-b)/DAY)+'天';return m<24?m+'月龄':Math.floor(m/12)+'岁'+(m%12?m%12+'个月':'');}
const API={isSelected,VACCINES:V,SOURCE,seriesPlan,upcoming,timeline,ics,ageText,addAge,parse,fmt};
if(typeof module!=='undefined')module.exports=API;else root.VT=API;
})(this);

</script>
<script>
const KEY='vt_data_v1';let PERSIST=true,tab='dash';
const store=(()=>{try{const ls=window.localStorage,t='__vt_t';ls.setItem(t,'1');ls.removeItem(t);return ls}catch(e){PERSIST=false;const m={};return{getItem:k=>k in m?m[k]:null,setItem:(k,v)=>{m[k]=String(v)}}}})();

let S=load();if(S.children.length&&!S.children.some(c=>c.id===S.cur))S.cur=S.children[0].id;
const save=()=>{try{store.setItem(KEY,JSON.stringify(S))}catch(e){PERSIST=false}};const $=id=>document.getElementById(id);
const cur=()=>S.children.find(c=>c.id===S.cur);
// 展示层：统一转义，并把长破折号/区间号换成普通连字符（数据文件保持原文不改）
const esc=s=>String(s??'').replace(/[—–]/g,'-').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST={done:'已完成',soon:'即将到期',overdue:'逾期需补种',future:'未到时间',expired:'已超龄',alt:'不适用',covered:'联合疫苗覆盖',unselected:'未选择'};
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);

const days=d=>Math.round((VT.parse(d)-VT.parse(today()))/864e5);
const rel=d=>{const n=days(d);return n<0?`已逾期 ${-n} 天`:n===0?'今天':`${n} 天后`};

let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2400)}
function render(){try{renderInner()}catch(e){console.error(e);$('main').innerHTML='<div class="panel err">页面渲染出错：'+esc(e&&e.message||e)+'<div style="margin-top:12px"><button class="btn" onclick="location.reload()">重新加载</button></div></div>'}}
const DEMO=()=>({cur:'c1',children:[{id:'c1',name:'林小禾(示例)',birth:'2026-02-12',sex:'M',records:[{vid:'hepb',date:'2026-02-12'},{vid:'bcg',date:'2026-02-12'},{vid:'hepb',date:'2026-03-12'},{vid:'polio',date:'2026-04-12'},{vid:'polio',date:'2026-05-12'},{vid:'dtap',date:'2026-05-12'},{vid:'dtap',date:'2026-06-12'}]}]});

 $('persist').hidden=PERSIST;

 $('src').innerHTML='数据来源：'+esc(VT.SOURCE)+' 标注“以说明书为准”的自费疫苗程序因产品而异。';
 if(!c){$('main').innerHTML=`<section class="panel hello"><div><h1>欢迎使用接种簿</h1><p>填写孩子的出生日期，即可看到免费和自费疫苗计划，并按已打记录推算下一针。</p>
  <div class="acts"><button class="btn p" id="addFirst" onclick="editChild()">添加第一个孩子</button><button class="btn" id="demoBtn" onclick="loadDemo()">查看示例</button></div></div>
  <ol><li><span><b>添加孩子</b>姓名、出生日期、性别</span></li><li><span><b>记录已打的针</b>日期、批号、门诊都可以记</span></li><li><span><b>看下一针</b>按最小间隔和推荐月龄自动推算，逾期会提示补种原则</span></li></ol></section>`;return}
 const plan=VT.seriesPlan(c,today());
 const chip=s=>s.later?`<span class="chip s-${s.status}">${ST[s.status]}</span><span class="chip s-covered">前4剂由五联覆盖</span>`:s.status==='covered'?`<span class="chip s-covered">由${esc(short(s.coveredBy))}覆盖</span>`:`<span class="chip s-${s.status}">${ST[s.status]}</span>`;
 const kind=s=>s.nip?'':'<span class="chip k-self">自费</span>';
 const row=s=>`<div class="v"><div><span class="n">${esc(s.name)}</span>${kind(s)}${chip(s)}</div>
  <div class="meta">已接种 ${s.given}/${s.total}${s.status==='covered'?`，计划由${esc(short(s.coveredBy))}代替接种，无需单独提醒${s.laterDue?`；之后的${esc(s.laterLabel)}仍需接种（约 ${s.laterDue}）`:''}`:''}${s.due?`，下一剂${esc(s.nextLabel)}：<b>${s.due}</b>（${rel(s.due)}）`:''}${s.perProduct?'。以产品说明书为准':''}</div>
  ${!['done','expired','alt','covered','unselected'].includes(s.status)?`<div class="act"><button class="btn sm" onclick="addRec('${s.id}')">记录接种</button></div>`:''}
  ${s.status==='overdue'&&s.catchupNote?`<div class="tip">补种原则：${esc(s.catchupNote)}</div>`:''}</div>`;
 const sp=plan.filter(s=>!s.nip);
 const spPanel=`<section class="panel" id="spPlan"><div class="sec-h"><h3>自费疫苗计划</h3><span class="faint">勾选后才会提醒</span></div>
  <div class="opts">${sp.map(s=>{const rec=(c.records||[]).some(r=>r.vid===s.id);return `<label class="opt ${s.selected?'on':''}"><input type="checkbox" data-sp="${s.id}" ${s.selected?'checked':''} onchange="toggleSP('${s.id}',this.checked)"><span>${esc(s.name)}${rec?'<small>已有接种记录</small>':s.excl?'<small>轮状疫苗二选一</small>':''}</span></label>`}).join('')}</div>
  <p class="faint" style="margin-top:10px">选择五联后，百白破前4剂、脊灰4剂和 Hib 由五联代替，不再单独提醒；6 周岁第5剂百白破仍需接种。</p></section>`;
 const tools=`<div class="tools"><button class="btn sm" onclick="editChild(cur())">编辑资料</button><button class="btn sm" onclick="exportICS()">导出日历</button><button class="btn sm" onclick="exportJSON()">导出备份</button><button class="btn sm" onclick="$('imp').click()">导入备份</button><button class="btn sm link danger" onclick="delChild()">删除孩子</button></div>`;
 const cnt=k=>plan.filter(s=>s.nip&&s.status===k).length;
 const aside=`<aside class="panel aside who"><h2>${esc(c.name)}</h2><p class="muted">${c.sex==='F'?'女孩':'男孩'}，${VT.ageText(c.birth,today())}<span class="faint">（${c.birth} 出生）</span></p>
  <div class="nums"><div class="late"><b>${cnt('overdue')}</b><span>免费疫苗逾期</span></div><div class="soon"><b>${cnt('soon')}</b><span>30 天内到期</span></div><div><b>${cnt('done')}</b><span>免费疫苗已完成</span></div><div><b>${(c.records||[]).length}</b><span>接种记录</span></div></div>${tools}</aside>`;
 let h='';
 if(tab==='dash'){const up=VT.upcoming(c,today()),nip=up.filter(s=>s.nip),n=nip[0];
  const hero=n?`<section class="panel next ${n.status==='overdue'?'late':''}" aria-label="下一针"><div class="when">${n.status==='overdue'?'尽快补种':md(n.due)}<small>${n.status==='overdue'?'已过推荐时间':rel(n.due)}</small></div><div class="what"><h2>下一针：${esc(n.name)}</h2><p>${esc(n.nextLabel)}${n.status==='overdue'?'。补种前请先咨询接种门诊':''}</p></div>
   <div class="acts"><button class="btn" onclick="addRec('${n.id}')">记录接种</button><button class="btn ghost" onclick="exportICS()">导出日历</button></div></section>`:`<section class="panel next"><div class="what"><h2>免费疫苗都已完成</h2><p class="muted">可以看看下方的自费疫苗。</p></div></section>`;
  h=`<div class="grid"><div class="stack">${hero}<section class="panel" id="upNip"><div class="sec-h"><h3>待接种</h3><span class="faint">按日期排序</span></div>${nip.map(row).join('')||'<p class="muted">没有待接种的免费疫苗。</p>'}${(()=>{const cv=plan.filter(x=>x.status==='covered');return cv.length?`<div class="covered-note"><b>由${esc(short(cv[0].coveredBy))}覆盖，不单独提醒</b>${cv.map(x=>`<span class="chip s-covered">${esc(x.name.replace(/\(.*$/,''))}${x.laterDue?' 前4剂':''}</span>`).join('')}</div>`:''})()}</section>
  <section class="panel" id="upSelf"><div class="sec-h"><h3>已选的自费疫苗</h3></div>${up.filter(s=>!s.nip).map(row).join('')||'<p class="muted" style="padding:6px 0">还没有选择自费疫苗。</p>'}
  ${(()=>{const av=plan.filter(s=>!s.nip&&!s.selected&&!(s.excl&&plan.some(o=>o.excl===s.excl&&o.selected)));return av.length?`<details class="avail"><summary>可选的自费疫苗（${av.length}）</summary><div class="opts">${av.map(s=>`<button class="btn sm" data-add="${s.id}" onclick="toggleSP('${s.id}',true)">＋ ${esc(s.name)}</button>`).join('')}</div></details>`:''})()}
  <p class="faint" style="margin-top:8px">自费疫苗自愿接种，是否接种请咨询接种门诊。</p></section></div><div class="stack">${aside}${spPanel}</div></div>`;}
 if(tab==='all'){h=`<div class="cols"><section class="panel"><div class="sec-h"><h3>免疫规划疫苗</h3><span class="faint">免费</span></div>${plan.filter(s=>s.nip).map(row).join('')}</section>
  <section class="panel"><div class="sec-h"><h3>非免疫规划疫苗</h3><span class="faint">自费、自愿</span></div>${plan.filter(s=>!s.nip&&s.selected).map(row).join('')||'<p class="muted">尚未选择自费疫苗，可在概览页的“自费疫苗计划”中勾选。</p>'}<p class="faint" style="margin-top:10px">记录五联疫苗(DTaP-IPV/Hib)后，对应剂次的百白破、脊灰、Hib 会自动计为已完成。2026 年版免疫规划为 13 周岁女孩免费接种 2 剂双价 HPV；自费四价、九价以说明书为准。</p></section></div>`;}
 if(tab==='tl'){const recs=c.records||[];let last='';h='<section class="panel"><div class="tl">';VT.timeline(c).forEach(t=>{const a=t.age,lab=a.y?a.y+'岁'+(a.m?a.m+'个月':''):a.m?a.m+'月龄':a.w?a.w+'周龄':'出生时';if(lab!==last){h+=`<div class="age">${lab}<span class="faint">${t.date}</span></div>`;last=lab}
  const r=recs.filter(x=>x.vid===t.vid).sort((x,y)=>x.date<y.date?-1:1)[t.dose];h+=`<div class="row ${r?'ok':''}"><span class="mk">${r?'✓':'○'}</span><span>${esc(t.name)}，${esc(t.label)}${t.nip?'':'<span class="chip k-self">自费</span>'}${r?` <span class="faint">已于 ${r.date} 接种</span>`:''}</span></div>`});h+='</div></section>';}
 if(tab==='rec'){const recs=(c.records||[]).map((r,i)=>({...r,i})).sort((a,b)=>a.date<b.date?1:-1);h=`<section class="panel"><div class="sec-h"><h3>接种记录</h3><span class="faint">${recs.length} 条</span><span style="flex:1"></span><button class="btn p sm" onclick="addRec()">添加记录</button></div>${recs.map(r=>{const v=VT.VACCINES.find(v=>v.id===r.vid);return `<div class="v"><div><span class="n">${esc(v?v.name:r.vid)}</span></div><div class="meta">${r.date}${r.batch?`，批号 ${esc(r.batch)}`:''}${r.note?`，${esc(r.note)}`:''}</div><div class="act"><button class="btn sm link" onclick="addRec(null,${r.i})">编辑</button><button class="btn sm link danger" onclick="delRec(${r.i})">删除</button></div></div>`}).join('')||'<p class="muted" style="padding:12px 0">还没有记录。打过的针可以在这里补录。</p>'}</section>`;}
 $('main').innerHTML=h;}
function dialog(html,onok,okText){$('dform').innerHTML=html+'<div class="d-acts"><button class="btn" value="c" formnovalidate>取消</button><button class="btn p" value="ok">'+esc(okText||'保存')+'</button></div>';$('dlg').showModal();$('dlg').onclose=()=>{if($('dlg').returnValue==='ok')onok(new FormData($('dform')))}}
function editChild(c){dialog(`<h3>${c?'编辑资料':'添加孩子'}</h3><label class="f"><span>姓名或小名</span><input name="name" required value="${esc(c?.name)}"></label><label class="f"><span>出生日期</span><input type="date" name="birth" required value="${c?.birth||''}"></label><label class="f"><span>性别</span><select name="sex"><option value="M">男孩</option><option value="F" ${c?.sex==='F'?'selected':''}>女孩</option></select></label>`,f=>{const o={name:f.get('name'),birth:f.get('birth'),sex:f.get('sex')};if(!o.name||!o.birth)return;if(c)Object.assign(c,o);else{o.id='c'+Date.now();o.records=[];o.selfPaid={};S.children.push(o);S.cur=o.id;tab='dash'}save();render();toast(c?'已保存修改':'已添加 '+o.name)},c?'保存修改':'添加孩子')}
function toggleSP(id,on){const c=cur();if(!c)return;c.selfPaid=c.selfPaid||{};c.selfPaid[id]=!!on;const v=VT.VACCINES.find(x=>x.id===id);
 if(on&&v.excl)VT.VACCINES.filter(o=>o.excl===v.excl&&o.id!==id).forEach(o=>c.selfPaid[o.id]=false);save();render();toast(on?'已加入计划：'+v.name:'已移出计划：'+v.name)}
function delChild(){const c=cur();if(c&&confirm('删除 '+c.name+' 及全部记录？')){S.children=S.children.filter(x=>x!==c);S.cur=S.children[0]?.id||null;save();render()}}
function addRec(vid,i){const c=cur();if(!c)return;const r=i!=null?c.records[i]:{vid:vid||VT.VACCINES[0].id,date:today()};dialog(`<h3>${i!=null?'编辑记录':'记录接种'}</h3><label class="f"><span>疫苗</span><select name="vid">${VT.VACCINES.map(v=>`<option value="${v.id}" ${v.id===r.vid?'selected':''}>${esc(v.name)}${v.nip?'':'（自费）'}</option>`).join('')}</select></label><label class="f"><span>接种日期</span><input type="date" name="date" required value="${r.date}"></label><label class="f"><span>批号（可选）</span><input name="batch" value="${esc(r.batch)}"></label><label class="f"><span>门诊或备注（可选）</span><input name="note" value="${esc(r.note)}"></label>`,f=>{const o={vid:f.get('vid'),date:f.get('date'),batch:f.get('batch'),note:f.get('note')};if(!o.date)return;if(i!=null)c.records[i]=o;else c.records.push(o);const vv=VT.VACCINES.find(x=>x.id===o.vid);if(vv&&!vv.nip){c.selfPaid=c.selfPaid||{};c.selfPaid[o.vid]=true;if(vv.excl)VT.VACCINES.filter(x=>x.excl===vv.excl&&x.id!==o.vid).forEach(x=>{if(!c.records.some(r=>r.vid===x.id))c.selfPaid[x.id]=false})}save();render();toast(i!=null?'已保存修改':'已记录接种')},i!=null?'保存修改':'记录接种')}
function delRec(i){if(confirm('删除这条记录？')){cur().records.splice(i,1);save();render()}}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}
function exportJSON(){dl('疫苗记录备份-'+today()+'.json',JSON.stringify(S,null,2),'application/json')}
function importJSON(inp){const f=inp.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!Array.isArray(d.children))throw 0;S=d;if(!S.children.some(c=>c.id===S.cur))S.cur=S.children[0]?.id||null;save();render();toast('已导入 '+S.children.length+' 个孩子的记录')}catch(e){toast('文件格式不正确，请选择本工具导出的备份')}});inp.value=''}
function exportICS(){const c=cur();if(c)dl(c.name+'-疫苗计划.ics',VT.ics(c,today()),'text/calendar')}
try{if(/demo/.test(location.search+location.hash)&&!S.children.length){S=DEMO();save()}}catch(e){}
render();
</script></body></html>
