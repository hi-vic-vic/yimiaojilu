<style>
/* 接种簿：灰纸底、墨字，日期用一枚松绿印章。色来自图标，不另起一套。 */
:root{
 --bg:#fafafa;--surface:#ffffff;--raised:#f4f4f5;--line:rgba(23,23,23,.1);
 --text:#171717;--secondary:#525252;--muted:#737373;
 --accent:#4a7d68;--accent-deep:#3a6654;--accent-ink:#ffffff;

 --shadow:0 1px 2px rgba(0,0,0,.05);
 --r-card:16px;--r-ctl:8px;
 --ease:cubic-bezier(.22,1,.36,1);
 --font:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei","WenQuanYi Micro Hei",system-ui,sans-serif;
 --stamp:"Songti SC","STSong","Songti TC","Noto Serif CJK SC","Source Han Serif SC",var(--font);
}
@media (prefers-color-scheme:dark){:root{
 --bg:#141415;--surface:#19191b;--raised:#232325;--line:rgba(237,237,237,.1);
 --text:#ededed;--secondary:#a1a1a6;--muted:#85858b;
 --accent:#8fbfa8;--accent-deep:#c4ddd2;--accent-ink:#141415;
 --late:#f0a196;--soon:#e2bd78;--ok:#8fbfa8;
 --shadow:none}}
*{box-sizing:border-box}[hidden]{display:none!important}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--text);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:500;letter-spacing:0;text-wrap:balance;line-height:1.25}
p{margin:0;max-width:72ch}
.muted{color:var(--secondary)}.faint{color:var(--muted);font-size:12px;line-height:1.5}
button,select,input{font:inherit;color:inherit}
button,a,label,.opt{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--surface);cursor:pointer;white-space:nowrap;font-weight:400;box-shadow:none;
 transition:background-color 160ms var(--ease),border-color 160ms var(--ease),color 160ms var(--ease),transform 160ms var(--ease)}
.btn:hover{background:var(--raised)}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.btn.p:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
.btn.ghost{background:var(--surface);color:var(--text);border-color:var(--line)}
.btn.link{border-color:transparent;background:transparent;color:var(--accent);padding:0 12px}
.btn.link:hover{background:var(--raised)}
.btn.danger{color:var(--late)}
.btn.sm{padding:0 12px;font-size:14px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top-in{max-width:1440px;margin:0 auto;min-height:64px;padding:8px 32px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:500;font-size:18px;line-height:1;letter-spacing:0;color:var(--text)}
.mark{width:24px;height:24px;display:block;flex:none}
.brand small{font-weight:400;color:var(--secondary);font-size:13px;margin-left:8px;letter-spacing:0}
.sync{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:13px;line-height:1.4;color:var(--secondary);flex-wrap:wrap;justify-content:flex-end;max-width:min(52vw,480px)}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync .dot.ok{background:var(--ok)}.sync .dot.busy{background:var(--soon)}.sync .dot.err{background:var(--late)}.sync .dot.off{background:var(--muted)}
.sync .em{color:var(--text);font-weight:500;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.picker{display:flex;align-items:center;gap:8px;flex-shrink:0}
.picker select{min-height:44px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--surface);padding:0 12px;max-width:46vw;font-size:16px}
.wrap{max-width:1440px;margin:0 auto;padding:24px 32px 64px}
.notice{border:1px solid var(--line);border-left:2px solid var(--soon);background:var(--surface);padding:12px 16px;border-radius:var(--r-ctl);font-size:14px;line-height:1.5;color:var(--text);margin:0 0 8px;max-width:none}
.notice.info{border-left-color:var(--accent)}
.tabs{display:flex;gap:4px;margin:16px 0 24px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:4px;background:var(--raised);border-radius:12px;border:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:1px solid transparent;background:transparent;padding:0 16px;cursor:pointer;color:var(--secondary);white-space:nowrap;font-size:15px;font-weight:400;border-radius:var(--r-ctl);min-height:44px;
 transition:background-color 160ms var(--ease),color 160ms var(--ease),border-color 160ms var(--ease)}
.tabs button:hover{color:var(--text);background:var(--surface)}
.tabs button.on{color:var(--text);font-weight:500;background:var(--surface);border-color:var(--line)}
.panel{background:var(--surface);border-radius:var(--r-card);border:1px solid var(--line);padding:20px;box-shadow:var(--shadow)}
.bento{display:grid;gap:16px;grid-template-columns:1fr;grid-template-areas:"hero" "stats" "rail" "up" "sp";align-items:start}
.bento-hero{grid-area:hero}.bento-stats{grid-area:stats}
.bento-rail{grid-area:rail;display:flex;flex-direction:column;gap:16px;width:100%}
.bento-up{grid-area:up}.bento-sp{grid-area:sp}
.bento-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;padding:8px 4px}
.stat{padding:12px;display:flex;flex-direction:column;justify-content:center;gap:4px;min-height:88px}
.stat+.stat{box-shadow:inset 1px 0 0 var(--line)}
.stat b{font-size:32px;line-height:1;font-weight:500;letter-spacing:0;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--secondary);line-height:1.4}
.stat.late b{color:var(--late)}
@media (min-width:860px){
 .wrap{padding:32px 32px 80px}
 .panel{padding:24px}
 .tabs{margin:24px 0 32px}
 .bento{grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:24px;grid-template-areas:"hero stats" "up rail" "sp sp"}
 .bento-stats{grid-template-columns:1fr;align-content:center;height:100%;padding:12px 8px}
 .stat{min-height:72px}
 .stat+.stat{box-shadow:inset 0 1px 0 var(--line)}
}
.next{display:grid;grid-template-columns:1fr;gap:16px;align-items:center;justify-items:start;padding:24px}
.stamp{width:132px;height:132px;border-radius:50%;border:1.5px solid var(--accent);background:var(--surface);
 box-shadow:inset 0 0 0 4px var(--surface),inset 0 0 0 5.5px var(--accent);
 display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--accent);
 font-family:var(--stamp);font-size:22px;font-weight:500;line-height:1.15;letter-spacing:0;padding:16px}

.next.late .stamp{border-color:var(--late);color:var(--late);box-shadow:inset 0 0 0 4px var(--surface),inset 0 0 0 5.5px var(--late)}
.next.late .stamp small{color:var(--late)}
.next .what h2{font-size:22px;font-weight:500;line-height:1.3}
.next .what p{margin-top:8px;color:var(--secondary);max-width:none}
.next .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

 .stamp{width:168px;height:168px;font-size:28px}

}
.sec-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px 12px;margin-bottom:8px}
.sec-h h3{font-size:16px;font-weight:500}
.v{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;padding:16px 0}
.v+.v{border-top:1px solid var(--line)}
.v .n{font-weight:500;font-size:15px;line-height:1.4}
.v .meta{grid-column:1;color:var(--secondary);font-size:14px;line-height:1.5;max-width:72ch}

.v .tip{grid-column:1/-1;font-size:13px;line-height:1.5;color:var(--late);background:transparent;border-left:2px solid var(--late);border-radius:0;padding:4px 0 4px 12px;margin-top:4px;max-width:72ch}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:16px;font-weight:400;letter-spacing:0;padding:0;margin-left:8px;vertical-align:1px;color:var(--secondary);background:none;border:0}
.chip:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--muted);flex:none}
.s-overdue{color:var(--late)}.s-overdue:before{background:var(--late)}
.s-soon{color:var(--soon)}.s-soon:before{background:var(--soon)}
.s-done{color:var(--ok)}.s-done:before{background:var(--ok)}
.s-covered{color:var(--accent)}.s-covered:before{background:var(--accent)}
.s-future,.s-expired,.s-alt,.s-unselected{color:var(--secondary)}
.k-self{color:var(--muted)}.k-self:before{background:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.opt{display:flex;align-items:center;gap:8px;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r-ctl);cursor:pointer;font-size:14px;background:var(--surface);
 transition:background-color 160ms var(--ease),border-color 160ms var(--ease)}
.opt:hover{background:var(--raised)}
.opt.on{border-color:var(--accent);background:var(--surface)}
.opt input{accent-color:var(--accent);width:18px;height:18px;margin:0;flex:none}
.opt small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.covered-note{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;color:var(--secondary);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.covered-note b{font-weight:500;margin-right:4px}.covered-note .chip{margin-left:0}
#spPlan.panel{padding:0;overflow:hidden}
.sp-plan-h{display:flex;align-items:center;gap:12px;width:100%;padding:16px 20px;border:0;background:transparent;cursor:pointer;text-align:left;font:inherit;color:inherit;border-radius:var(--r-card);min-height:56px}
.sp-plan-h:hover{background:var(--raised)}
.sp-plan-h h3{margin:0;font-size:16px;font-weight:500;flex:none}
.sp-plan-sum{flex:1;font-size:14px;color:var(--secondary);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-chev{flex:none;width:8px;height:8px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);transition:transform 160ms var(--ease)}
#spPlan.sp-open .sp-chev{transform:rotate(45deg)}
.sp-plan-body{display:none;padding:0 20px 20px}
#spPlan.sp-open .sp-plan-body{display:block}
.who h2{font-size:22px;font-weight:500}
.who p{margin-top:4px}
.avatar{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--raised);color:var(--text);display:inline-flex;align-items:center;justify-content:center;overflow:hidden;flex:none;font-size:18px;font-weight:500;line-height:1}
.avatar-lg{width:72px;height:72px;font-size:28px}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.who-head{display:flex;align-items:center;gap:16px;min-width:0}
.who-head>div{min-width:0}
.avatar-field{display:flex;align-items:center;gap:12px;margin-top:8px}
.avatar-actions{display:flex;flex-wrap:wrap;gap:8px}
.who .avatar-actions{margin-top:12px}
.act-block{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.act-row{display:flex;flex-wrap:wrap;gap:8px}
.act-row.primary .btn.p{flex:1;min-width:8rem;justify-content:center}
.act-data{border:1px solid var(--line);border-radius:var(--r-ctl);padding:4px 12px;background:var(--bg)}
.act-data summary{cursor:pointer;font-size:14px;font-weight:500;color:var(--secondary);list-style:none;display:flex;align-items:center;gap:8px;min-height:44px}
.act-data summary::-webkit-details-marker{display:none}
.act-data summary:after{content:"";width:8px;height:8px;margin-left:auto;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);transition:transform 160ms var(--ease)}
.act-data[open] summary:after{transform:rotate(45deg)}
.act-data .act-row{margin:0 0 8px}
.prog-block+.prog-block{margin-top:16px}
.prog-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;font-weight:500;margin-bottom:8px}
.prog-track{height:8px;border-radius:4px;background:var(--raised);overflow:hidden}
.prog-fill{height:100%;border-radius:4px;background:var(--accent);min-width:0}
.recent-list{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:12px}
.recent-list li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;font-size:14px;line-height:1.4}
.recent-list .nm{font-weight:500}.recent-list .dt{color:var(--secondary);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ahead-list{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:12px}
.ahead-list li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:baseline;font-size:14px}
.ahead-list .dt{font-weight:500;color:var(--text);font-variant-numeric:tabular-nums;min-width:5.5em;white-space:nowrap}
.ahead-list .nm{color:var(--text)}.ahead-list .sub{grid-column:2;color:var(--secondary);font-size:12px;line-height:1.4}
.tl{position:relative;padding-left:24px}
.tl:before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1px;background:var(--line)}
.tl .age{position:relative;margin:24px 0 8px;font-weight:500}
.tl .age:first-child{margin-top:0}

.tl .row.ok .mk{color:var(--ok)}

.src{margin-top:32px;font-size:12px;color:var(--muted);max-width:90ch;line-height:1.6}

 .btn.p{background:var(--text);border-color:var(--text);color:var(--bg)}

<header class="top"><div class="top-in"><div class="brand"><img class="mark" src="icons/favicon-64.png" alt="" width="24" height="24"><span>接种簿<small>中国儿童疫苗记录</small></span></div>

<script>
const AUTH_KEY='vt_auth_v1';let tab='dash',spPlanOpen=false;
// 本机仅记住登录会话；业务数据只在本页内存中显示，不写入浏览器存储。
const store=(()=>{try{return window.localStorage}catch(e){return null}})();
const emptyState=()=>({children:[],cur:null});
let S=emptyState(),authSession=null,syncStatus='off',syncBusy=false,cloudReady=false,authEpoch=0,readEpoch=0;
const sb=()=>({url:VT.SUPABASE_URL,key:VT.SUPABASE_ANON_KEY});
function loadSession(){try{const s=JSON.parse(store?.getItem(AUTH_KEY)||'null');return s&&s.access_token?s:null}catch(e){return null}}
function persistSession(s){try{if(s)store?.setItem(AUTH_KEY,JSON.stringify(s));else store?.removeItem(AUTH_KEY)}catch(e){console.warn('无法记住登录状态')}}
function legacyBackup(){try{return VT.normalizeAppState(JSON.parse(store?.getItem('vt_data_v1')||'null'))}catch(e){return null}}
function exportLegacy(){const old=legacyBackup();if(old)dl('旧版本机备份-'+today()+'.json',JSON.stringify(old,null,2),'application/json')}
function clearLegacy(){if(confirm('请确认已导出备份，或已登录并导入云端。删除旧版本机记录？')){try{store?.removeItem('vt_data_v1');render()}catch(e){toast('无法清除旧版记录')}}}
function canEdit(){if(!authSession){openLogin();return false}if(!cloudReady){toast('请先成功读取云端记录');return false}if(syncBusy){toast('正在保存，请稍候');return false}if(!navigator.onLine){toast('当前离线，无法保存到云端');return false}return true}
async function changeState(change){if(!canEdit())return false;const next=VT.normalizeAppState(S),epoch=authEpoch;change(next);syncBusy=true;setSyncStatus('busy');renderSyncBar();
 try{await pushCloudState(next);if(epoch!==authEpoch)return false;applyState(next);setSyncStatus('ok');render();return true}
 catch(e){console.warn(e);if(epoch===authEpoch){setSyncStatus('err');render();toast('云端保存失败，修改未保存，请重试')}return false}
 finally{syncBusy=false;render()}}
const $=id=>document.getElementById(id);
function setSyncStatus(st,msg){syncStatus=st;const dot=$('syncDot'),tx=$('syncText');if(dot){dot.className='dot '+(st==='ok'?'ok':st==='busy'?'busy':st==='err'?'err':'off')}if(tx)tx.textContent=msg}
function renderSyncBar(){
 const btn=$('syncBtn');if(!btn)return;
 if(authSession){btn.textContent='退出';btn.classList.remove('p');$('syncText').innerHTML=`<span class="em" title="${esc(authSession.user.email||'')}">${esc(authSession.user.email||'已登录')}</span> · ${syncStatus==='busy'?'云端处理中…':!navigator.onLine?'离线，不能保存':syncStatus==='ok'?'已保存到云端':syncStatus==='err'?'云端请求失败':navigator.onLine?'待读取':'离线'}`}
 else{btn.textContent='登录';btn.classList.remove('p');setSyncStatus('off','远端存储 · 请先登录')}
}
async function sbFetch(path,opts={}){const h=opts.headers||{};h.apikey=sb().key;if(authSession?.access_token)h.Authorization='Bearer '+authSession.access_token;if(opts.body&&!h['Content-Type'])h['Content-Type']='application/json';const r=await fetch(sb().url+path,{...opts,headers:h,cache:'no-store'});return r}
async function ensureFreshToken(){if(!authSession||!VT.needsTokenRefresh(authSession))return authSession;const epoch=authEpoch;
 const r=await sbFetch('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:authSession.refresh_token})});
 if(!r.ok)throw new Error('登录已过期');const b=await r.json();if(epoch!==authEpoch)throw new Error('登录状态已改变');const next=VT.sessionFromAuthResponse(b);if(!next?.user?.id)throw new Error('登录刷新失败');authSession=next;persistSession(authSession);return authSession}
async function fetchCloudState(){await ensureFreshToken();const uid=authSession.user.id;
 const r=await sbFetch('/rest/v1/vaccine_data?user_id=eq.'+encodeURIComponent(uid)+'&select=data,updated_at');
 if(!r.ok)throw new Error('读取云端失败');const rows=await r.json();if(!rows.length)return emptyState();const state=VT.normalizeAppState(rows[0].data);if(!state)throw new Error('云端数据格式错误');return state}
async function pushCloudState(next){if(!authSession)throw new Error('请先登录');await ensureFreshToken();const uid=authSession.user.id,body={user_id:uid,data:VT.normalizeAppState(next),updated_at:new Date().toISOString()};
 const r=await sbFetch('/rest/v1/vaccine_data',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(body)});
 if(!r.ok)throw new Error('上传失败')}
function applyState(next){S=VT.normalizeAppState(next)||emptyState()}
async function reconcileAfterLogin(){if(!authSession||syncBusy)return;const epoch=authEpoch,read=++readEpoch;cloudReady=false;setSyncStatus('busy');render();
 try{const cloud=await fetchCloudState();if(epoch!==authEpoch||read!==readEpoch)return;applyState(cloud);cloudReady=true;setSyncStatus('ok')}
 catch(e){if(epoch!==authEpoch||read!==readEpoch)return;console.warn(e);applyState(emptyState());setSyncStatus('err');toast('无法读取云端，请联网后重试；不会使用本机记录')}
 render()}
async function consumeAuthHash(){const h=location.hash;if(!h||(!h.includes('access_token')&&!h.includes('error')))return null;
 if(h.includes('error=')){history.replaceState(null,'',location.pathname+location.search);toast('登录链接无效或已过期');return null}
 const sess=VT.parseAuthHash(h);if(sess){authSession=sess;persistSession(authSession);history.replaceState(null,'',location.pathname+location.search);toast('已登录');return sess}return null}
async function initAuth(){authSession=await consumeAuthHash()||loadSession();render();if(authSession)await reconcileAfterLogin()}
function syncAction(){if(authSession){if(syncBusy)return toast('正在保存，请稍候');if(confirm('退出登录？退出后本页不再显示孩子资料和记录。')){authEpoch++;authSession=null;cloudReady=false;applyState(emptyState());persistSession(null);setSyncStatus('off');render();toast('已退出')}}else openLogin()}
function openLogin(){dialog(`<h3>邮箱登录 / 远端记录</h3><p class="muted">登录后从云端读取记录，所有修改仅保存到云端。未登录或离线时不能添加、修改或导入记录。</p>
<label class="f"><span>邮箱</span><input type="email" name="email" required autocomplete="email" placeholder="you@example.com"></label>
<button class="btn p" type="button" style="width:100%;margin-top:16px" onclick="sendMagicLink(this)">发送登录链接</button>
<p id="loginStatus" class="muted" role="status" aria-live="polite"></p>
<p class="faint" style="margin:16px 0 8px">或输入邮件中的 6 位验证码</p>
<label class="f"><span>验证码</span><input name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6 位数字"></label>
<button class="btn" type="button" style="width:100%;margin-top:8px" onclick="verifyOtp(this)">确认验证码</button>`,null,'关闭')}
async function sendMagicLink(btn){const f=$('dform'),email=(new FormData(f)).get('email');if(!email)return;btn.disabled=true;
 const status=$('loginStatus');status.textContent='正在发送…';
 try{const r=await fetch(sb().url+'/auth/v1/otp?redirect_to='+encodeURIComponent(location.origin+location.pathname),{method:'POST',headers:{apikey:sb().key,'Content-Type':'application/json'},body:JSON.stringify({email,create_user:true})});
 if(!r.ok){const error=await r.json().catch(()=>({}));let message='发送失败（HTTP '+r.status+'），请稍后重试';
 if(error.code==='over_email_send_rate_limit')message='项目邮件发送额度已用完，请等待额度恢复后重试。Supabase 默认邮件服务每小时仅支持 2 封，持续使用需配置自定义 SMTP。';
 else if(r.status===429)message='请求过于频繁，请稍后重试，不要连续点击发送';
 else if(error.code==='email_address_invalid')message='邮箱地址无效，请检查后重试';
 else if(error.code==='email_address_not_authorized')message='当前默认邮件服务仅允许向项目成员发送邮件，其他邮箱需要配置自定义 SMTP';
 throw new Error(message)}status.textContent='登录链接已发送，请使用最新邮件中的链接；旧链接可能已失效。';toast('登录链接已发送，请查收邮件')}
 catch(e){status.textContent=e instanceof TypeError?'网络连接失败，请检查网络后重试':e.message;toast(status.textContent)}finally{btn.disabled=false}}
async function verifyOtp(btn){const f=$('dform'),email=(new FormData(f)).get('email'),token=(new FormData(f)).get('otp');if(!email||!token||String(token).length<6)return toast('请填写邮箱和 6 位验证码');btn.disabled=true;
 try{const r=await fetch(sb().url+'/auth/v1/verify',{method:'POST',headers:{apikey:sb().key,'Content-Type':'application/json'},body:JSON.stringify({email,token,type:'email'})});
 if(!r.ok)throw 0;authSession=VT.sessionFromAuthResponse(await r.json());if(!authSession)throw 0;persistSession(authSession);$('dlg').close();toast('已登录');authEpoch++;await reconcileAfterLogin();render()}catch(e){toast('验证码错误或已过期')}finally{btn.disabled=false}}

  const ahead=up.filter(s=>{const d=days(s.due);return d>=0&&d<=92}).slice(0,5);
  const aheadPanel=`<section class="panel bento-tile bento-ahead" aria-label="未来三个月"><div class="sec-h"><h3>未来 3 个月</h3><span class="faint">待接种提醒</span></div>${ahead.length?`<ul class="ahead-list">${ahead.map(s=>`<li><span class="dt">${s.dueKind==='earliest'?'最早'+md(s.due):md(s.due)}</span><span class="nm">${esc(short(s.name))}${s.nip?'':' <span class="chip k-self">自费</span>'}</span><span class="sub">${s.dueKind==='earliest'?esc(s.nextLabel)+' · 间隔至少4周，不是预约':s.id==='flu'?esc(s.nextLabel)+' · '+rel(s.due)+'，不是预约':esc(s.nextLabel)+' · '+rel(s.due)}</span></li>`).join('')}</ul>`:'<p class="muted">这三个月内没有待接种提醒。</p>'}</section>`;
  const hasAvatar=!!VT.normalizeAvatar(c.avatar);
  const avatarBtns=`<div class="avatar-actions"><button class="btn sm" type="button" onclick="pickAvatar(cur().id)">${hasAvatar?'更换头像':'上传头像'}</button>${hasAvatar?'<button class="btn sm" type="button" onclick="clearAvatar(cur().id)">删除头像</button>':''}</div>`;
  const whoPanel=`<aside class="panel bento-tile bento-who who"><div class="who-head"><span class="avatar avatar-lg" aria-hidden="true">${avatarInner(c)}</span><div><h2>${esc(c.name)}</h2><p class="muted">${c.sex==='F'?'女孩':'男孩'}，${VT.ageText(c.birth,T)}<span class="faint">（${c.birth} 出生）</span></p></div></div>
  <p class="faint" style="margin-top:8px">已录入 ${(c.records||[]).length} 条接种记录</p>${avatarBtns}${actBlock}</aside>`;
  const rail=`<div class="bento-rail">${whoPanel}${progPanel}${recentPanel}${aheadPanel}</div>`;
  const coveredNote=(()=>{const cv=plan.filter(x=>x.status==='covered');return cv.length?`<div class="covered-note"><b>由${esc(short(cv[0].coveredBy))}覆盖，不单独提醒</b>${cv.map(x=>`<span class="chip s-covered">${esc(x.name.replace(/\(.*$/,''))}${x.laterDue?' 前4剂':''}</span>`).join('')}</div>`:''})();
  const upList=up.length?up.map(row).join(''):'<p class="muted">没有待接种的疫苗。</p>';
  const upInner=`<div class="up-inner"><div class="up-list">${upList}</div>${coveredNote?`<div class="up-foot">${coveredNote}</div>`:''}</div>`;
  h=`<div class="bento">${hero}${stats}${rail}<section class="panel bento-tile bento-up" id="upNip"><div class="sec-h"><h3>待接种</h3><span class="faint">免疫规划与已选自费，按日期排序</span></div>${fluEntry}${upInner}</section>
  ${spPanel.replace('class="panel sp-plan','class="panel bento-tile bento-sp sp-plan')}</div>`;}
 if(tab==='all'){h=`<div class="cols"><section class="panel"><div class="sec-h"><h3>免疫规划疫苗</h3><span class="faint">免费</span></div>${plan.filter(s=>s.nip).map(row).join('')}</section>
  <section class="panel"><div class="sec-h"><h3>非免疫规划疫苗</h3><span class="faint">自费、自愿</span></div>${plan.filter(s=>!s.nip&&(s.selected||s.given>0||s.id==='flu')).map(row).join('')||'<p class="muted">尚未选择自费疫苗，可在概览页「自费疫苗计划」中勾选。</p>'}<p class="faint" style="margin-top:12px">记录五联疫苗(DTaP-IPV/Hib)后，对应剂次的百白破、脊灰、Hib 会自动计为已完成。2026 年版免疫规划为 13 周岁女孩免费接种 2 剂双价 HPV；自费四价、九价以说明书为准。流感未勾选计划时也可直接记录接种。</p></section></div>`;}
 if(tab==='tl'){const recs=c.records||[];let last='';h='<section class="panel"><div class="tl">';VT.timeline(c,today()).forEach(t=>{const a=t.age,lab=t.ageLabel||(a.y?a.y+'岁'+(a.m?a.m+'个月':''):a.m?a.m+'月龄':a.w?a.w+'周龄':'出生时');if(lab!==last){h+=`<div class="age">${lab}<span class="faint">${t.date}</span></div>`;last=lab}
  if(t.vid==='flu'){const note=t.done?`已于 ${t.date} 接种`:t.dueKind==='earliest'?`最早 ${t.date}（间隔至少4周，不是预约）`:t.seasonDone?`下一季建议 ${t.date} 起（不是预约）`:`建议 ${t.date} 起（不是预约）`;h+=`<div class="row ${t.done?'ok':''}" data-flu="1"><span class="mk"><i class="mk-i${t.done?' done':''}" aria-hidden="true"></i></span><span>${esc(t.name)}，${esc(t.label)}<span class="chip k-self">自费</span> <span class="faint">${esc(note)}。本站不会自动预约或推送。</span></span>${t.done?'':`<button class="btn sm" type="button" onclick="addRec('flu')">记录接种</button>`}</div>`;return}
  const r=recs.filter(x=>x.vid===t.vid).sort((x,y)=>x.date<y.date?-1:1)[t.dose];h+=`<div class="row ${r?'ok':''}"><span class="mk"><i class="mk-i${r?' done':''}" aria-hidden="true"></i></span><span>${esc(t.name)}，${esc(t.label)}${t.nip?'':'<span class="chip k-self">自费</span>'}${r?` <span class="faint">已于 ${r.date} 接种</span>`:''}</span></div>`});h+='</div></section>';}
 if(tab==='rec'){const fluLabels=VT.fluHistoryLabels(c);const recs=(c.records||[]).map((r,i)=>({...r,i})).sort((a,b)=>a.date<b.date?1:-1);h=`<section class="panel"><div class="sec-h"><h3>接种记录</h3><span class="faint">${recs.length} 条</span><span style="flex:1"></span><button class="btn p sm" onclick="addRec()">添加记录</button></div>${recs.map(r=>{const v=VT.VACCINES.find(v=>v.id===r.vid);const dose=r.vid==='flu'&&fluLabels[r.i]?`，${esc(fluLabels[r.i])}`:'';return `<div class="v"><div><span class="n">${esc(v?v.name:r.vid)}</span></div><div class="meta">${r.date}${dose}${r.batch?`，批号 ${esc(r.batch)}`:''}${r.note?`，${esc(r.note)}`:''}</div><div class="act"><button class="btn sm link" onclick="addRec(null,${r.i})">编辑</button><button class="btn sm link danger" onclick="delRec(${r.i})">删除</button></div></div>`}).join('')||'<p class="muted" style="padding:12px 0">还没有记录。打过的针可以在这里补录。</p>'}</section>`;}
 $('main').innerHTML=h;}
function dialog(html,onok,okText){const epoch=authEpoch;$('dform').innerHTML=html+'<div class="d-acts"><button class="btn" value="c" formnovalidate>取消</button><button class="btn p" value="ok">'+esc(okText||'保存')+'</button></div>';$('dlg').showModal();$('dlg').onclose=()=>{if($('dlg').returnValue==='ok'&&onok&&epoch===authEpoch)onok(new FormData($('dform')))};return $('dform')}
let avatarTarget=null,draftAvatar='',draftAvatarTouched=false,avatarBusy=false;
function avatarInner(child){const url=VT.normalizeAvatar(child&&child.avatar);return url?`<img src="${url}" alt="">`:esc(VT.avatarInitial(child&&child.name));}
function paintChildAvatar(child){const el=$('childAvatar');if(!el)return;if(!child){el.hidden=true;el.innerHTML='';return}el.hidden=false;el.innerHTML=avatarInner(child)}
function paintDraftAvatar(name){const el=$('draftAvatar');if(!el)return;const url=VT.normalizeAvatar(draftAvatar);const typed=name!=null?name:($('dform')&&$('dform').elements.name?$('dform').elements.name.value:'');el.innerHTML=url?`<img src="${url}" alt="">`:esc(VT.avatarInitial(typed));const clr=$('draftAvatarClear'),pick=$('draftAvatarPick');if(clr)clr.hidden=!url;if(pick)pick.textContent=url?'更换头像':'上传头像'}
function pickAvatar(target){if(!canEdit()||avatarBusy){if(avatarBusy)toast('正在处理照片，请稍候');return}avatarTarget=target;const input=$('avatarFile');input.value='';input.click()}
async function decodeAvatarFile(file){
 if(typeof createImageBitmap==='function'){
  try{return await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){try{return await createImageBitmap(file)}catch(e2){}}
 }
 const url=URL.createObjectURL(file);let release=true;
 try{
  const img=await new Promise((resolve,reject)=>{const el=new Image();el.onload=()=>resolve(el);el.onerror=()=>reject(new Error('无法读取这张照片，请换成 JPG 或 PNG'));el.src=url});
  if(typeof createImageBitmap==='function'){
   try{return await createImageBitmap(img,{imageOrientation:'from-image'})}catch(e){try{return await createImageBitmap(img)}catch(e2){}}
  }
  release=false;img._avatarUrl=url;return img;
 }finally{if(release)URL.revokeObjectURL(url)}
}
async function fileToAvatarDataUrl(file){
 if(!file)throw new Error('请选择照片');
 const bmp=await decodeAvatarFile(file);
 try{
  const w=bmp.width||bmp.naturalWidth,h=bmp.height||bmp.naturalHeight,crop=VT.avatarCrop(w,h);
  if(!crop)throw new Error('无法读取这张照片，请换成 JPG 或 PNG');
  const canvas=document.createElement('canvas');canvas.width=crop.dw;canvas.height=crop.dh;
  const ctx=canvas.getContext('2d',{alpha:false});
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,crop.dw,crop.dh);
  ctx.drawImage(bmp,crop.sx,crop.sy,crop.sw,crop.sh,0,0,crop.dw,crop.dh);
  const max=VT.AVATAR_MAX_BYTES;let out='';
  for(let q=0.86;q>=0.22;q=Math.round((q-0.08)*100)/100){
   out=canvas.toDataURL('image/jpeg',q);
   const n=VT.avatarByteLength(out);
   if(n&&n<=max)return out;
  }
  throw new Error('照片仍然太大，请换一张');
 }finally{if(bmp.close)bmp.close();if(bmp._avatarUrl)URL.revokeObjectURL(bmp._avatarUrl)}
}
async function onAvatarFile(input){
 const file=input.files&&input.files[0];input.value='';const target=avatarTarget;if(!file||!target||!canEdit())return;
 const save=$('dform')&&$('dform').querySelector('button.p');avatarBusy=true;if(save)save.disabled=true;
 try{
  const url=await fileToAvatarDataUrl(file);
  if(target==='draft'){draftAvatar=url;draftAvatarTouched=true;paintDraftAvatar();toast('头像已裁好，保存资料后写入云端')}
  else{const ok=await changeState(next=>{const child=next.children.find(x=>x.id===target);if(child)child.avatar=url});if(ok)toast('头像已保存到云端')}
 }catch(e){toast(e&&e.message||'无法读取这张照片，请换成 JPG 或 PNG')}
 finally{avatarBusy=false;if(save&&save.isConnected)save.disabled=false}
}
async function clearAvatar(target){
 if(!canEdit())return;

 if(ok)toast('已删除头像');

function editChild(c){if(!canEdit())return;draftAvatar=VT.normalizeAvatar(c&&c.avatar)||'';draftAvatarTouched=false;const has=!!draftAvatar;dialog(`<h3>${c?'编辑资料':'添加孩子'}</h3><div class="avatar-field"><span class="avatar avatar-lg" id="draftAvatar" aria-hidden="true">${c?avatarInner(c):esc(VT.avatarInitial(''))}</span><div class="avatar-actions"><button class="btn sm" type="button" id="draftAvatarPick" onclick="pickAvatar('draft')">${has?'更换头像':'上传头像'}</button><button class="btn sm" type="button" id="draftAvatarClear" onclick="clearAvatar('draft')" ${has?'':'hidden'}>删除头像</button></div></div><label class="f"><span>姓名或小名</span><input name="name" required value="${esc(c?.name)}" oninput="paintDraftAvatar(this.value)"></label><label class="f"><span>出生日期</span><input type="date" name="birth" required value="${c?.birth||''}"></label><label class="f"><span>性别</span><select name="sex"><option value="M">男孩</option><option value="F" ${c?.sex==='F'?'selected':''}>女孩</option></select></label>`,async f=>{if(avatarBusy)return toast('正在处理照片，请稍候');const o={name:f.get('name'),birth:f.get('birth'),sex:f.get('sex')};if(!o.name||!o.birth)return;const ok=await changeState(next=>{if(c){const target=next.children.find(x=>x.id===c.id);Object.assign(target,o);if(draftAvatarTouched){const avatar=VT.normalizeAvatar(draftAvatar);if(avatar)target.avatar=avatar;else delete target.avatar}}else{o.id='c'+Date.now();o.records=[];o.selfPaid={};const avatar=draftAvatarTouched?VT.normalizeAvatar(draftAvatar):'';if(avatar)o.avatar=avatar;next.children.push(o);next.cur=o.id;tab='dash'}});if(ok)toast(c?'已保存到云端':'已添加 '+o.name)},c?'保存修改':'添加孩子')}
async function toggleSP(id,on){const idc=cur()?.id;await changeState(next=>{const c=next.children.find(x=>x.id===idc);if(!c)return;c.selfPaid=c.selfPaid||{};c.selfPaid[id]=!!on;const v=VT.VACCINES.find(x=>x.id===id);if(on&&v.excl)VT.VACCINES.filter(o=>o.excl===v.excl&&o.id!==id).forEach(o=>c.selfPaid[o.id]=false)});render()}
async function delChild(){const c=cur();if(c&&confirm('删除 '+c.name+' 及全部记录？'))await changeState(next=>{next.children=next.children.filter(x=>x.id!==c.id);next.cur=next.children[0]?.id||null})}
let recEditIndex=null;
function syncFluDoseFields(){const form=$('dform');if(!form||!form.vid)return;const box=$('fluDoseBox');if(!box)return;const show=form.vid.value==='flu';box.hidden=!show;if(!show)return;const info=VT.describeFluDose(cur(),form.date.value,recEditIndex,today());form.fluDose.innerHTML=`<option value="${info.dose==null?'':info.dose}">${esc(info.label)}</option>`;$('fluDoseHint').textContent=info.hint;if(info.minDate)form.date.min=info.minDate;}
function addRec(vid,i){if(!canEdit())return;const c=cur();if(!c)return;recEditIndex=i!=null?i:null;const r=i!=null?c.records[i]:{vid:vid||VT.VACCINES[0].id,date:today()};const fluDate=r.vid==='flu'&&i==null&&!VT.validateFluRecord(c,r.date,null).ok?'':(r.date||'');const form=dialog(`<h3>${i!=null?'编辑记录':'记录接种'}</h3><label class="f"><span>疫苗</span><select name="vid" onchange="syncFluDoseFields()">${VT.VACCINES.map(v=>`<option value="${v.id}" ${v.id===r.vid?'selected':''}>${esc(v.name)}${v.nip?'':'（自费）'}</option>`).join('')}</select></label><div id="fluDoseBox"${r.vid==='flu'?'':' hidden'}><label class="f"><span>剂次</span><select name="fluDose" id="fluDose" aria-label="剂次"></select></label><p id="fluDoseHint" class="faint"></p></div><label class="f"><span>接种日期</span><input type="date" name="date" required value="${fluDate}" oninput="syncFluDoseFields()"></label><label class="f"><span>批号（可选）</span><input name="batch" value="${esc(r.batch)}"></label><label class="f"><span>门诊或备注（可选）</span><input name="note" value="${esc(r.note)}"></label>`,async f=>{const o={vid:f.get('vid'),date:f.get('date'),batch:f.get('batch'),note:f.get('note')};if(!o.date)return;if(o.vid==='flu'){const chk=VT.validateFluRecord(c,o.date,recEditIndex);if(!chk.ok){toast(chk.reason);return}}const ok=await changeState(next=>{const child=next.children.find(x=>x.id===c.id);if(i!=null)child.records[i]=o;else child.records.push(o);const vv=VT.VACCINES.find(x=>x.id===o.vid);if(vv&&!vv.nip){child.selfPaid=child.selfPaid||{};child.selfPaid[o.vid]=true;if(vv.excl)VT.VACCINES.filter(x=>x.excl===vv.excl&&x.id!==o.vid).forEach(x=>{if(!child.records.some(r=>r.vid===x.id))child.selfPaid[x.id]=false})}});if(ok)toast(i!=null?'已保存到云端':'已记录接种并保存到云端')},i!=null?'保存修改':'记录接种');if(!form)return;form.onsubmit=e=>{if(e.submitter&&e.submitter.value!=='ok')return;const data=new FormData(form);if(data.get('vid')!=='flu')return;const chk=VT.validateFluRecord(cur(),data.get('date'),recEditIndex);if(!chk.ok){e.preventDefault();toast(chk.reason)}};syncFluDoseFields()}
